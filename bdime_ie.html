<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度在线拼音输入法演示</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        h2 {
            border-bottom: 2px solid #4e6ef2;
            padding-bottom: 10px;
            color: #1f2329;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .tip {
            background-color: #f0f4ff;
            border-left: 4px solid #4e6ef2;
            padding: 12px 16px;
            margin-top: 20px;
            font-size: 14px;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>

    <h2>网页版在线拼音输入法体验</h2>
    <p>点击下方任意输入框并打字，即可直接体验在线拼音输入：</p>

    <div class="form-group">
        <label for="input1">指定绑定输入框（ID: input1）：</label>
        <input type="text" id="input1" placeholder="点击这里，用拼音打字试试...">
    </div>

    <div class="form-group">
        <label for="input2">多行文本框（ID: input2）：</label>
        <textarea id="input2" placeholder="这里也可以输入长文本..."></textarea>
    </div>

    <div class="tip">
        <strong>提示：</strong>
        <ul>
            <li>输入法开启后，按下字母键即可弹出选词框。</li>
            <li>按 <code>Ctrl + Shift</code> 或 <code>Shift</code> 键（视 SDK 配置）可以切换中英文状态。</li>
        </ul>
    </div>

    <!-- 1. 配置百度输入法参数 -->
    <script type="text/javascript">
        var bdime_option = {
            ch: true,         // 默认开启中文模式
            bc: true,         // 默认半角
            pt: true,         // 默认中文标点
            on: true,         // 默认开启输入法
            domain: "",       // 不记录 cookie
            username: "",     // 用户词库标识（可填写自定义 ID）
            targets: ['input1', 'input2'] // 指定生效的输入框 ID
        };
    </script>

    <!-- 2. 引入百度在线输入法核心 SDK -->
    <script type="text/javascript" src="http://www.baidu.com/olime/bdime_open.js"></script>

</body>
</html>
